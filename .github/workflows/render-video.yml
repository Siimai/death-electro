name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Composition ID to render
        default: AmigaDemo
        required: true
        type: string
      output:
        description: Output filename (without directory)
        default: video.mp4
        required: true
        type: string
      crf:
        description: Quality (CRF, lower is better quality; 1-51)
        default: "18"
        required: false
        type: string

concurrency:
  group: render-video-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Render
        env:
          COMPOSITION: ${{ inputs.composition }}
          OUTPUT: ${{ inputs.output }}
          CRF: ${{ inputs.crf }}
        run: |
          PROPS='{}'
          if [ ! -f "public/10-Death Electro.mp3" ]; then
            echo "::warning::public/10-Death Electro.mp3 not found; rendering without audio"
            PROPS='{"includeAudio":false}'
          fi
          npx remotion render src/index.ts "$COMPOSITION" "out/$(basename "$OUTPUT")" --crf="$CRF" --props="$PROPS"

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/*
          if-no-files-found: error
